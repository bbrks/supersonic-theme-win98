[SupersonicTheme]
Name = "Windows 98"
Version = "0.2"
SupportsDark = true
SupportsLight = true

# Win98 had no dark mode. This mixes High Contrast Black with the navy title bar
# and teal desktop, using only the classic 16-color palette.
[DarkColors]
PageBackground = "#000000"
ListHeader = "#000080"
PageHeader = "#000080"
Background = "#000080"
ScrollBar = "#C0C0C0"
Button = "#008080"
DisabledButton = "#404040"
Disabled = "#808080"
Foreground = "#FFFFFF"
Hyperlink = "#00FFFF"
InputBackground = "#000000"
InputBorder = "#C0C0C0"
MenuBackground = "#000080"
OverlayBackground = "#000080"
Placeholder = "#808080"
Primary = "#008080"
Focus = "#00FFFF"
Hover = "#FFFFFF1A"
Pressed = "#808080"
Selection = "#80008099"
Separator = "#808080"
Shadow = "#000000AA"
Error = "#FF0000"
Success = "#00FF00"
Warning = "#FFFF00"

# Classic "Windows Standard" scheme: silver 3D face, white content, navy highlight.
[LightColors]
PageBackground = "#FFFFFF"
ListHeader = "#C0C0C0"
PageHeader = "#C0C0C0"
Background = "#C0C0C0"
ScrollBar = "#808080"
Button = "#DFDFDF"
DisabledButton = "#C0C0C0"
Disabled = "#808080"
Foreground = "#000000"
Hyperlink = "#0000FF"
InputBackground = "#FFFFFF"
InputBorder = "#808080"
MenuBackground = "#C0C0C0"
OverlayBackground = "#C0C0C0"
Placeholder = "#808080"
Primary = "#000080"
Focus = "#000080"
Hover = "#0000801A"
Pressed = "#808080"
Selection = "#0000804D"
Separator = "#808080"
Shadow = "#00000066"
Error = "#FF0000"
Success = "#008000"
Warning = "#808000"
